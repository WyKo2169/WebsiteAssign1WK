<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Complaint Form</title>
    <link rel="stylesheet" href="pageColour.css">
    <script src="extraInfo.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Vehicle Complaint Form</h1>
        <p>Please provide the following information about your complaint.</p>
        <form id="complaintForm">
            <fieldset>
                <legend>Customer Information</legend>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName">
                <span class="error" id="nameError"></span>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
                <span class="error" id="emailError"></span>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <span class="error" id="phoneError"></span>
            </fieldset>
            <fieldset>
                <legend>Vehicle Information</legend>
                <label for="make">Vehicle Make:</label>
                <input type="text" id="make" name="make">
                <span class="error" id="makeError"></span>
                <label for="model">Vehicle Model:</label>
                <input type="text" id="model" name="model">
                <span class="error" id="modelError"></span>
                <label for="vin">VIN:</label>
                <input type="text" id="vin" name="vin" maxlength="17">
                <span class="error" id="vinError"></span>
            </fieldset>
            <fieldset>
                <legend>Complaint Details</legend>
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">
                <span class="error" id="subjectError"></span>
                <label for="description">Detailed Description:</label>
                <textarea id="description" name="description" rows="6"></textarea>
                <span class="error" id="descriptionError"></span>
            </fieldset>
            <fieldset>
                <legend>File Upload</legend>
                <label for="images">Upload Images:</label>
                <input type="file" id="images" name="images" accept="image/*" multiple>
                <small>You may upload images related to your complaint.</small>
            </fieldset>
            <button type="submit">Submit Complaint</button>
            <p id="successMessage"></p>
        </form>
    </div>
</body>
</html>
